# ── Yobante Colis — Admin — site nginx pour le VPS Contabo ────────────────
#
# À copier sur le serveur :
#   /etc/nginx/sites-available/yobante-admin-colis
# Activer :
#   ln -sfn /etc/nginx/sites-available/yobante-admin-colis /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Le certificat de admin.yobanterek.com existe déjà : ce fichier peut donc
# déclarer le bloc 443 directement, sans passer par certbot au préalable.

# Backend colis, publié par docker-compose sur la boucle locale uniquement.
# Adapter le port si API_PORT_HOTE a été changé dans le .env.prod du backend.
upstream colis_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.yobanterek.com;

    # Renouvellement Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.yobanterek.com;

    ssl_certificate     /etc/letsencrypt/live/admin.yobanterek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yobanterek.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yobante-admin-colis;
    index index.html;

    # ── En-têtes de sécurité ──────────────────────────────────────────────
    # Repris de render.yaml, qui servait l'application avant ce VPS.
    # `frame-ancestors` n'est pris en compte qu'en en-tête HTTP : le reste de
    # la CSP est injecté dans index.html au build (voir src/lib/csp.ts).
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Content-Security-Policy   "frame-ancestors 'none'"            always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── API : même origine ────────────────────────────────────────────────
    # L'application appelle `/api` (VITE_API_URL vide, voir src/api/client.ts).
    # Nginx relaie vers le backend colis. Deux bénéfices : aucun CORS à
    # configurer, et le cookie httpOnly du refresh token (sameSite strict)
    # circule normalement puisqu'on reste sur la même origine.
    #
    # La barre finale de `proxy_pass` retire le préfixe /api : /api/auth/login
    # arrive donc en /auth/login, que le backend monte à la racine en plus de
    # son chemin canonique /api/v1.
    location /api/ {
        proxy_pass http://colis_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }

    # ── Fichiers générés par Vite ─────────────────────────────────────────
    # Leur nom porte un hash : ils sont immuables, cache long sans risque.
    #
    # ⚠️ `add_header` dans un bloc imbriqué REMPLACE les en-têtes hérités du
    # serveur. Les en-têtes de sécurité ci-dessus ne s'appliquent donc pas
    # ici — sans conséquence pour du JS et du CSS, mais c'est la raison pour
    # laquelle ils sont redéclarés dans le bloc index.html juste après.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html n'est jamais mis en cache : c'est lui qui pointe vers les
    # nouveaux fichiers hashés, un cache ici servirait indéfiniment l'ancienne
    # version. Les en-têtes de sécurité y sont redéclarés (voir ci-dessus).
    location = /index.html {
        add_header Cache-Control             "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options           "DENY"                              always;
        add_header X-Content-Type-Options    "nosniff"                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"            always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Application monopage : toute URL inconnue est rendue par React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ne jamais servir de fichier caché (.env, .git…), « .well-known » excepté.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}

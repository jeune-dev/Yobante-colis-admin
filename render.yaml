# Blueprint Render : site statique (build Vite servi par le CDN de Render).
# Dans Render : New > Blueprint > choisir ce dépôt.
services:
  - type: web
    runtime: static
    name: yobante-colis-admin
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # URL publique de l'API, préfixe /api/v1 compris. Lue AU BUILD par Vite :
      # après l'avoir changée, relancer un déploiement (« Save, rebuild, and deploy »).
      - key: VITE_API_URL
        value: https://yobnate-colis-back.onrender.com/api/v1
      - key: NODE_VERSION
        value: "22"
    routes:
      # Application monopage : toute URL inconnue renvoie index.html (React Router)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Les fichiers générés portent un hash dans leur nom : cache long sans risque
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Le reste de la CSP est dans index.html (générée au build, voir vite.config.ts) ;
      # frame-ancestors n'est pris en compte qu'en en-tête HTTP.
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      # index.html n'est jamais mis en cache : un nouveau déploiement est vu tout de suite
      - path: /index.html
        name: Cache-Control
        value: no-cache
